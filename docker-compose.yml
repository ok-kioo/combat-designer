services:
  engine:
    build:
      context: ./engine
      dockerfile: Dockerfile
    container_name: combat_designer_engine
    restart: unless-stopped
    ports:
      - "3003:3003"
    environment:
      - PORT=3003
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3003/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - combat_net

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: combat_designer_api
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - HOST=0.0.0.0
      - PORT=3001
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ENGINE_URL=http://engine:3003
      - DATABASE_URL=postgres://${POSTGRES_USER:-combat_designer}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-combat_designer}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:?NEO4J_PASSWORD is required}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - combat_net

  mcp:
    build:
      context: .
      dockerfile: mcp/Dockerfile
    container_name: combat_designer_mcp
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=3002
      - API_URL=http://api:3001
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3002/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - combat_net

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: combat_designer_web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=3000
      - API_URL=http://api:3001
      - BACKEND_ALLOWED_HOSTS=api
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - combat_net

  postgres:
    image: postgres:16-alpine
    container_name: combat_designer_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-combat_designer}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - POSTGRES_DB=${POSTGRES_DB:-combat_designer}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-combat_designer} -d ${POSTGRES_DB:-combat_designer}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - combat_net

  neo4j:
    image: neo4j:${NEO4J_VERSION:-5.26.0-community}
    container_name: combat_designer_neo4j
    restart: unless-stopped
    ports:
      - "7474:7474" # HTTP Browser UI
      - "7687:7687" # Bolt Protocol
    environment:
      - NEO4J_AUTH=${NEO4J_AUTH:?NEO4J_AUTH is required}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_memory_pagecache_size=512M
      - NEO4J_dbms_memory_heap_initial__size=512M
      - NEO4J_dbms_memory_heap_max__size=1G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - combat_net

networks:
  combat_net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
