[package]
name = "combat-domain"
version = "0.1.0"
edition = "2021"
description = "Engine-agnostic canonical combat domain model and invariants"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
thiserror = "2.0"

[dev-dependencies]
proptest = "1.6"
