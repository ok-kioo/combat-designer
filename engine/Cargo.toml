[package]
name = "combat-engine"
version = "0.1.0"
edition = "2021"
description = "Pure, deterministic discrete frame-clock combat engine, canonical domain model and mechanical verification gate"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
thiserror = "2.0"

[dev-dependencies]
proptest = "1.6"
