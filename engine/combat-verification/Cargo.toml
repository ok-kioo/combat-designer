[package]
name = "combat-verification"
version = "0.1.0"
edition = "2021"
description = "Pure, deterministic mechanical verification and gate decision engine"

[dependencies]
combat-domain = { path = "../combat-domain" }
combat-simulation = { path = "../combat-simulation" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
thiserror = "2.0"

[dev-dependencies]
proptest = "1.6"
