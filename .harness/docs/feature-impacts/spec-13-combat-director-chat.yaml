  registry_changed:
    - "Registered skills: analyze_attack, analyze_balance, find_combo, optimize_combo, diagnose_stun_loop, analyze_counterplay, analyze_frame_advantage, propose_balance_adjustment, validate_proposal, explain_simulation"

authorization:
  principals_affected:
    - user
    - llm
  workspace_rules_changed:
    - "Chat turns strictly isolated by (user_id, workspace_id, conversation_id) derived from JWT.sub and workspace ownership"

security:
  threats_addressed:
    - "Direct prompt injection attempting to bypass system rules or execute commands"
    - "Indirect prompt injection embedded in attack names, descriptions, or Unity asset metadata"
    - "Delimiter escape attempts in textual inputs"
    - "Tool injection and privilege escalation by LLM"
    - "Cross-user and cross-workspace conversation context leakage"
    - "Fabricated SimulationResult and MechanicalValidationResult"
    - "XSS injection via Markdown rendering and dangerous link protocols"
    - "Fake execution status messages without actual backend actions"
  invariants_affected:
    - "LLM is untrusted for mechanical truth — Mechanical Validator and Simulator are sole authorities"
    - "Canonical flow: Proposal -> Simulation -> Mechanical Validation -> Spec Validation -> Recommendation"
    - "Standard OUT_OF_SCOPE response with zero tool calls, zero graph queries, and zero simulations"
    - "Public activities conceal internal infrastructure details (trace IDs, SQL, Cypher, MCP method names)"

