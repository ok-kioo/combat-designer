feature_id: combat-director-chat-013
title: Combat Director Chat, Context Management & LLM Safety
owner: Implementation Agent
status: verified
intent: Implement a robust, safe, evidence-oriented conversational experience for the Combat Director, restricting LLM to combat systems analysis (frame data, balance, combos, simulation, impact, validation, and proposals) while enforcing context hierarchy, tool allowlists per skill, typed error codes, safe markdown streaming/sanitization, and strict workspace/user isolation without direct engine mutation.
non_goals:
  - No general purpose chatbot functionality.
  - No direct modification of the Unity project or engine.
  - No combat_apply_change tool in Combat Director.
  - No LLM fabrication of SimulationResult or MechanicalValidationResult.
  - No execution of tools or graph queries when intent is OUT_OF_SCOPE.
domain_owner: llm

approval:
  gate_run_id: gate_run_spec13_combat_director_001
  gate_rule_set_version: "1.0.0"
  model_revision: "rev-1"
  approved_by: "human_lead"
  approved_at: "2026-09-10T22:00:00Z"
  approval_evidence: "Full test suite passing: 13.T.1-20 functional tests, 13.SEC.1-28 security tests, 13.UI.1-13 frontend tests, regression suites for SPEC 00-12, zero circular dependencies."

