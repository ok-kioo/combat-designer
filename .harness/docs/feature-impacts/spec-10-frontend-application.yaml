feature_id: frontend-application-001
title: Frontend Application and LLM Input Integration
owner: Implementation Agent
status: verified
intent: Deliver multi-page frontend application (Combat Explorer, Attack Catalog, Simulation & Gate Workbench, ChangeSet Review) consuming backend REST routes, and construct structured LLM input context envelope for backend Director Chat orchestration.
non_goals:
  - No direct client-side database connections (Postgres, Neo4j).
  - No client-side bypassing of Mechanical Gate validation.
  - No direct modification of canonical state without going through backend HTTP routes.
domain_owner: ui

approval:
  gate_run_id: gate_run_spec10_frontend_001
  gate_rule_set_version: "1.0.0"
  model_revision: "rev-1"
  approved_by: "human_lead"
  approved_at: "2026-09-09T23:55:00Z"
  approval_evidence: "Automated regression tests, frontend interaction tests, backend API integration tests, and FIC schema validation all passing."

contracts:
  - name: director-chat-context-envelope
    version: v1
    change: additive
  - name: workspace-api-routes
    version: v1
    change: additive

