feature_id: platform-delivery-001
title: Export Bundle Delivery and Multi-Tenant Workspace Model
owner: Implementation Agent
status: verified
intent: Implement hermetic platform delivery boundary where backend never accesses client filesystem directly; input arrives as Export Bundles (Unity/Unreal/Godot) over HTTP upload scoped to mandatory workspace_id. Provide two-column Combat Explorer UI (Project Panel and Combat Director) and strict multi-tenant partition across Postgres, Neo4j, and MCP.
non_goals:
  - No direct backend connections to user machines or client socket servers.
  - No client-side bypass of server-side ingestion normalization or envelope validation.
  - No alteration of Rust engine physics or frame clock determinism.
domain_owner: platform-architecture

