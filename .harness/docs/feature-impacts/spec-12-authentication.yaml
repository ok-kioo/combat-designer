feature_id: authentication-project-security-012
title: JWT authentication and user-owned combat projects
owner: Implementation Agent
status: verified
intent: Introduzir autenticação real baseada em username, password (Argon2id), JWT access token e refresh token rotacionável, substituindo WorkspaceMembership por propriedade direta de projetos (User 1 --- N Workspace).
non_goals:
  - SSO/OAuth com provedores externos nesta versão (v1).
  - Multi-factor authentication.
  - Colaboração multiusuário, organizações, roles ou memberships na v1.
domain_owner: authentication

approval:
  gate_run_id: gate_run_spec12_auth_001
  gate_rule_set_version: "1.0.0"
  model_revision: "rev-1"
  approved_by: "usr-developer-default"
  approved_at: "2026-09-10T04:20:00Z"
  approval_evidence: "Unit tests (password-hasher, token-service) and integration tests for fail-closed direct project ownership, token rotation, family reuse revocation, and module boundaries passing."

contracts:
  - name: user
    version: v1
    change: additive
  - name: workspace
    version: v1
    change: additive
  - name: refresh-token
    version: v1
    change: additive
  - name: mcp-principal
    version: v2
    change: breaking

categories:
  - authorization
  - security
  - infrastructure
  - api
  - workspace

data_sources:
  - backend-auth-api
  - postgres-auth-store

kg:
  nodes_added: []
  nodes_changed: []
  relationships_added: []

simulation:
  states_added: []
  transitions_added: []
  timing_rules_changed: []

gates:
  added: []
  changed: []
  affected: []

gateway:
  capabilities_added: []
  capabilities_changed: []
  tools_added: []
  tools_changed:
    - "GatewayAuthenticator.authenticate"
  policy_changed:
    - "Authorization: Bearer <jwt> substitui x-authorized-workspaces; GatewayAuthenticator deriva principal_id exclusivamente de JWT sub"
  registry_changed: []

authorization:
  principals_affected:
    - user
  workspace_rules_changed:
    - "Workspace.owner_user_id === authenticated_user.id; fail-closed por padrão"
    - "isWorkspaceAuthorized deriva de JWT verificado + WorkspaceAuthorizationPort"

security:
  threats_addressed:
    - "corrige bypass de tenant isolation: default-allow quando header ausente"
    - "reutilização de refresh token roubado dispara revogação de família"
    - "timing attacks em verificação de senhas (mitigado com timingSafeEqual e Argon2id)"
  invariants_affected:
    - "fail-closed por padrão: sem token ou sem propriedade retorna 401/403"
    - "senhas com Argon2id com parâmetros configuráveis e comparadas em tempo constante"
    - "tokens sensíveis e senhas redactados de toda telemetria e logs"

audit:
  events_added:
    - "auth_user_registered"
    - "auth_user_logged_in"
    - "auth_token_refreshed"
    - "auth_user_logged_out"
    - "auth_token_reuse_detected"
  events_changed:
    - "approved_by em FIC/GateResult passa a referenciar User.id real"

mcp:
  tools_added: []
  resources_added: []

api:
  endpoints_added:
    - "POST /api/auth/register"
    - "POST /api/auth/login"
    - "POST /api/auth/refresh"
    - "POST /api/auth/logout"
    - "GET /api/auth/me"
    - "POST /api/workspaces"
    - "GET /api/workspaces"
    - "GET /api/workspaces/:workspace_id"
  endpoints_changed:
    - "ALL /api/workspaces/:workspace_id/* require verified Bearer token and owner_user_id authorization"

persistence:
  postgres_migrations:
    - "create table users"
    - "create table workspaces"
    - "create table refresh_tokens"
    - "add owner_user_id foreign key constraint on workspaces"
  neo4j_migrations: []

tests:
  unit:
    - "backend/tests/unit/auth/password-hasher.test.ts"
    - "backend/tests/unit/auth/token-service.test.ts"
  integration:
    - "backend/tests/integration/api/auth-tenant-security.test.ts"
  property: []
  fixtures:
    - "user sem propriedade tentando acessar workspace de outro usuário"
  e2e: []
  gateway: []

observability:
  metrics:
    - "auth_login_total"
    - "auth_refresh_total"
    - "auth_failure_total"
  traces:
    - "http_post_api_auth_login"
  logs:
    - "auth_login_success"
    - "auth_login_failure"
    - "auth_reuse_revocation"

rollback: "Reverter exige reintroduzir o header legado; planejar migração controlada de clientes para Bearer token."
risks: "Maior superfície de ataque em endpoints de login/refresh; mitigado com rate limits, hashes Argon2id seguros, e fail-closed por padrão."
