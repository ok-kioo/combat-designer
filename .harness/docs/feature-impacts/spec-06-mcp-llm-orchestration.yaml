security:
  threats_addressed:
    - "06.SEC.1 Prompt Injection in Combat Data (Treated as untrusted_text, cannot grant permissions)"
    - "06.SEC.2 Cross-Workspace Access (Denied by Gateway and ResourceProvider)"
    - "06.SEC.3 Confused Deputy Protection (Preserves principal, workspace, and correlation_id)"
    - "06.SEC.4 Privilege Escalation (LLM default denies apply, approve, and admin operations)"
    - "06.SEC.5 Path Traversal (Resource URI traversal rejected)"
    - "06.SEC.6 Oversized Request Payload (Enforces max request size limiter)"
    - "06.SEC.7 Excessive Tool Recursion (Recursion depth capped at 5)"
    - "06.SEC.8 Budget Abuse (Administrative bounds on simulation & verification parameters)"
    - "06.SEC.9 Forged GateResult / SimulationResult (Accepted only from trusted application execution paths)"
    - "06.SEC.10 Forged Human Approval (Strictly requires human principal_type for approval)"
    - "06.SEC.11 Stale Revision Race (Revision comparison rejects stale changes)"
    - "06.SEC.12 Secret Leakage Prevention (Redacts tokens/credentials from audit logs)"
