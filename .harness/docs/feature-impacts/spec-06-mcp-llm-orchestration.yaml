feature_id: spec-06-mcp-llm-orchestration
title: MCP Gateway, MCP Server & LLM Orchestration
owner: Implementation Agent
status: verified
intent: Implement secure MCP Gateway boundary with deny-by-default, explicit capabilities, workspace isolation, rate and budget limiters, tool registry with canonical aliases, MCP Server protocol integration via official MCP SDK, LLM intent orchestration without mechanical authority, and Application boundary enforcement with Human Approval.
non_goals:
  - No direct persistence or database driver access from MCP.
  - No direct execution of simulator or mechanical gate from MCP.
  - No mechanical safety decisions by LLM.
  - No auto-application of changesets without human approval.
  - SPEC 07 (Observability dashboard UI) is strictly NOT STARTED.
domain_owner: gateway

approval:
  gate_run_id: gate_run_spec06_mcp_001
  gate_rule_set_version: "1.0.0"
  model_revision: "rev-1"
  approved_by: "human_lead"
  approved_at: "2026-09-09T17:30:00Z"
  approval_evidence: "Automated regression tests, security tests (06.SEC.1-12), and gateway tests (06.T.1-12) all passing."

