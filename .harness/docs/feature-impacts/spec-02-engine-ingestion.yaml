feature_id: spec-02-engine-ingestion
title: Engine Ingestion Pipeline (Unity Export Bundle MVP)
owner: Implementation Agent
status: verified
intent: Implement engine-agnostic Export Bundle validation, Unity ScriptableObject YAML parsing, RawExtraction, domain normalization, provenance tracking, quarantine, conflict detection, and deterministic snapshot generation.
non_goals:
  - Does not connect to live Unity editor sockets or remote user filesystems.
  - Does not implement Unreal or Godot binary parsers in this phase.
  - Does not project into Neo4j graph (Spec 03).
domain_owner: ingestion

