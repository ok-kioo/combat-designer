feature_id: ingestion-security-001
title: Ingestion Security and Execution Limits
owner: Implementation Agent
status: verified
intent: Enforce multi-layer upload limits (DoS/JSON bomb protection), two-layer validation (Layer 1 Envelope schema vs Layer 2 per-asset quarantine), text sanitization defense in depth with untrusted_text propagation, strict workspace isolation across all queries, and execution budget (iterations/fuel and timeouts) with explainable BUDGET_EXCEEDED verdicts.
non_goals:
  - No wall clock time inside deterministic frame simulation loop.
  - No silent truncation or conversion of oversized or malformed payloads.
  - No bypass of mechanical gate or LLM hallucination of PASS.
domain_owner: ingestion

approval:
  gate_run_id: gate_run_spec09_security_001
  gate_rule_set_version: "1.0.0"
