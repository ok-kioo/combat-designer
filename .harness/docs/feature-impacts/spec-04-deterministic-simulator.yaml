feature_id: spec-04-deterministic-simulator
title: Deterministic Combat Simulator Engine & Application Port
owner: Implementation Agent
status: verified
intent: Implement pure, deterministic discrete frame-clock combat simulation in Rust (engine/combat-simulation) with strict 10-step contract frame execution loop, integer arithmetic only, zero wall-clock/sleep, deterministic tie-breaking, execution budget exhaustion (BUDGET_EXCEEDED), canonical SHA-256 state hashing, and Application layer SimulationPort.
non_goals:
  - Simulator strictly answers "WHAT HAPPENS?"; never decides safety or mechanical validity (Spec 05 Mechanical Gate responsibility).
  - Simulator does not grant authorization (Gateway responsibility).
  - Simulator does not expose direct HTTP/WebSocket/LLM access.
