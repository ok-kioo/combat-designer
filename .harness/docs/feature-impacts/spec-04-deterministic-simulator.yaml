security:
  threats_addressed:
    - "04.SEC.1 Unbounded Simulation Loop / DoS (Enforced ExecutionBudget: max_frames, max_events, max_transitions, max_entities returning BUDGET_EXCEEDED)"
    - "04.SEC.2 Nondeterministic Float Divergence (Zero floating-point gameplay math; 100% integer frames, permille damage)"
    - "04.SEC.3 Wall-Clock / Timing Side-Channels (Zero system clock, instant, sleep, or unseeded random)"
    - "04.SEC.4 Race Conditions in Concurrent Hits (Deterministic tie-breaking by frame, actor_id, attack_id, sequence)"
    - "04.SEC.5 Cross-Workspace State Leakage (Application layer SimulationPort validates authorized workspace_id before execution)"
