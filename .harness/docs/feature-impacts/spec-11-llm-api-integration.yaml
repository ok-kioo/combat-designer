feature_id: llm-api-integration-001
title: LLM API Integration for Chat Orchestration
owner: Implementation Agent
status: verified
intent: Replace deterministic mock in POST /chat with real Gemini API LLM integration using function calling, enabling the Combat Director to dynamically select and execute combat tools (search, simulate, verify, propose) based on user prompts.
non_goals:
  - No direct LLM access from frontend (all calls go through backend).
  - No LLM-fabricated Gate verdicts — Mechanical Gate remains sole authority.
  - No LLM approval or application of ChangeSets — human approval strictly required.
  - No persistent conversation history on backend — each POST is stateless.
domain_owner: infrastructure

approval:
  gate_run_id: gate_run_spec11_llm_001
  gate_rule_set_version: "1.0.0"
  model_revision: "rev-1"
  approved_by: "human_lead"
  approved_at: "2026-09-10T00:17:00Z"
  approval_evidence: "Unit tests, integration tests with mock LLM provider, backward compatibility validation, FIC schema validation all passing."

contracts:
  - name: llm-provider-port
    version: v1
    change: additive
  - name: chat-orchestrator-service
    version: v1
    change: additive
  - name: gemini-provider-adapter
    version: v1
    change: additive

categories:
  - infrastructure
  - api
  - gateway
  - security

data_sources:
