rollback: Remove LlmProvider injection from ApiServerConfig, ChatOrchestrator falls back to deterministic mock.
risks: Gemini API latency and cost per chat turn; mitigated by MAX_TOOL_CALL_ROUNDS limit, graceful fallback to mock, and model selection (gemini-3.7-flash for cost efficiency).
