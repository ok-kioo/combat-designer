  - name: graph-schema
    version: v1
    change: additive
  - name: graph-projection-status
    version: v1
    change: additive
  - name: query-catalog-q01-q06
    version: v1
    change: additive

categories:
  - graph
  - domain
  - security
  - workspace
  - infrastructure
  - audit

data_sources:
  - Canonical Combat Snapshot

kg:
  nodes_added:
    - Attack
    - Hitbox
    - CancelRule
    - ResourceCost
    - Provenance
    - ProjectionMetadata
  nodes_changed: []
  relationships_added:
