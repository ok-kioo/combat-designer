feature_id: spec-03-knowledge-graph
title: Knowledge Graph Projection & Query Catalog
owner: Implementation Agent
status: verified
intent: Project Canonical Combat Snapshots into Neo4j graph representation (attacks, hitboxes, cancels, resources, provenance, metadata) with strict workspace isolation, composite unique constraints, parameterized Cypher queries (Q01 to Q06), and deterministic stale detection.
non_goals:
  - Neo4j is never the mechanical authority; does not execute mechanical gate or physics simulation.
  - Does not implement Spec 04 deterministic simulator.
  - Does not expose direct HTTP/Neo4j access to LLMs (must route through Application / Gateway).
domain_owner: graph

approval:
  gate_run_id: null
  gate_rule_set_version: null
  model_revision: null
  approved_by: null
  approved_at: null
  approval_evidence: null

