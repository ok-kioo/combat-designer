  policy_changed: []
  registry_changed: []

authorization:
  principals_affected: []
  workspace_rules_changed: []

security:
  threats_addressed:
    - 03.SEC.1 Cross-Workspace Graph Pollution (Strict composite uniqueness and mandatory workspace_id on all nodes, edges, queries)
    - 03.SEC.2 Cypher Injection (100% Parameterized Cypher queries)
    - 03.SEC.3 Graph Query DoS (Clamped max_depth <= 10 and max_results <= 100 on recursive traversals)
    - 03.SEC.4 Stale / Drifted Projection Access (Deterministic hash comparison and graph_schema_version validation)
    - 03.SEC.5 Partial / Corrupted Projection Treatment (Atomic projection status marked ERROR upon failure)
  invariants_affected:
    - GW-I02
    - GW-I03
    - GW-I14
    - GW-I15

audit:
  events_added:
    - graph.snapshot.projected
    - graph.status.stale_detected
    - graph.query.executed
