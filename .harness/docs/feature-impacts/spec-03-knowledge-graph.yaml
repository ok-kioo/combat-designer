    - graph_projection_duration_ms
    - graph_queries_total
    - graph_stale_detected_total
  traces: []
  logs: []

rollback: Drop Neo4j constraints and purge nodes by workspace_id, revert backend/infrastructure/neo4j.
risks: Graph queries on unbounded traversal depth could consume excessive server resources; strictly bounded by clamped limits and workspace assertion.
