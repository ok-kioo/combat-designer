rollback: Revert engine/combat-verification, backend/contracts/src/verification, backend/application/src/ports/mechanical-gate-port.ts, and backend/application/src/use-cases/verify-combat.ts.
risks: Complex combative cycle combinations could exhaust cycle search budget; mitigated by bounded VerificationBudgetTracker and strict fail-closed BUDGET_EXCEEDED handling.
