security:
  threats_addressed:
    - "05.SEC.1 Workspace Isolation (Cross-workspace verification request strictly rejected; workspace_id required in all requests and results)"
    - "05.SEC.2 Stale GateResult (FreshnessContext enforces exact matching of workspace, revision, snapshot hash, input hash, profile, rule set version, and verifier version)"
    - "05.SEC.3 Inconsistent/Forged Content Hash (Deterministic SHA-256 canonical hashing over CanonicalGateResultForm without operational IDs)"
    - "05.SEC.4 Modified SimulationResult (Structural integrity and monotonic event sequence validation in G01)"
    - "05.SEC.5 Budget Bypass (Enforced VerificationBudgetTracker across events, states, cycles, and steps returning BUDGET_EXCEEDED)"
    - "05.SEC.6 Malformed Verification Request (Fail-closed structural boundary validation in Application and Verifier)"
    - "05.SEC.7 Non-Deterministic Evidence Ordering (Deterministic sorting key on frame, actor_id, attack_id, and evidence_id)"
    - "05.SEC.8 Invalid Profile Escalation (Research profile cannot authorize release; strict profile fails closed on inconclusive proof)"
    - "05.SEC.9 Replay Mismatch (State hash divergence detected and flagged as InvalidSimulation)"
    - "05.SEC.10 Revision Race (Revision changes invalidate prior gate results with STALE verdict)"
    - "05.SEC.11 Integer Overflow (All math uses checked/saturating integer arithmetic, zero floats)"
    - "05.SEC.12 Missing Provenance in Strict (Missing required provenance fields blocks PASS in strict mode)"
  invariants_affected:
    - GW-I01
    - GW-I02
    - GW-I03

