# ==============================================================================
# Feature Impact Contract (FIC): spec-05-combat-analysis-and-diagnostics
#
# NOTE: This FIC governs the mechanical analysis and diagnostics engine.
# In target architecture, runtime analysis produces Finding / AnalysisResult.
# Legacy Gate contracts are tracked under CODE_LEGACY_RUNTIME_GATE.
# ==============================================================================
feature_id: spec-05-mechanical-gate
title: Mechanical Gate Verification Engine & Application Port
owner: Implementation Agent
status: verified
intent: Implement pure, deterministic mechanical verification and safety gate engine in Rust (engine/combat-verification) with bounded execution budgets, fail-closed strict profile, G01-G11 safety rules, canonical GateResult SHA-256 hashing, and TypeScript contracts/application port.
non_goals:
  - Mechanical Gate strictly answers "IS IT SAFE / VALID?"; never simulates physics or collision math (Deterministic Simulator responsibility).
  - Mechanical Gate does not grant authorization or policy decisions (MCP Gateway responsibility).
  - Mechanical Gate does not make LLM calls or interpret LLM text as proof.
  - Mechanical Gate does not approve changesets or apply mutations (Human Approval responsibility).
domain_owner: verification

