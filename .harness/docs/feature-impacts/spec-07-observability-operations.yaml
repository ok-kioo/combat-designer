security:
  threats_addressed:
    - High-cardinality metric label resource exhaustion and memory bloat
    - Credential, secret, and token leakage in operational logs and metrics
    - Telemetry backend outages or exporter failures crashing deterministic domain calculations
    - Unauthenticated external access to internal operational telemetry endpoints
    - Telemetry correlation context or trace context masquerading as authenticated principal
    - Cross-workspace telemetry leakage and improper diagnostic isolation
  invariants_affected:
    - Fail-closed operational boundaries on /metrics and /health/dependencies
    - Telemetry failure isolation ensuring zero alteration of domain outcomes
    - Complete product frontend isolation from operations infrastructure

