  gate_run_id: gate_run_spec07_obs_001
  gate_rule_set_version: "1.0.0"
  model_revision: "rev-1"
  approved_by: "human_lead"
  approved_at: "2026-09-09T20:30:00Z"
  approval_evidence: "Automated regression tests, functional tests (07.T.1-19), security tests (07.SEC.1-16), and architecture boundary tests all passing."

